<section class="gameplay-section section" id="gameplay">
  <div class="section-title-wrapper benefits-title-wrapper">
    <div class="container section-title-container">
      <svg class="star-icon" width="16" height="16">
        <use href="./img/sprite.svg#icon-star"></use>
      </svg>
      <h2 class="section-title gameplay-title">How To Play</h2>
    </div>
  </div>
  <div class="gameplay-bg-wrapper">
    <div class="container gameplay-container">
      <p class="section-subtitle gameplay-subtitle">
        Observe, interact, discover
      </p>
      <div class="gameplay-swiper-container">
        <ul class="swiper-wrapper gameplay-swiper-wrapper">
          <li class="swiper-slide gameplay-slide">
            <picture>
              <source
                srcset="./img/gameplay/gameplay-img1-desk.png"
                media="(min-width: 1440px)"
                width="400"
                height="671" />
              <source
                srcset="./img/gameplay/gameplay-img1-mob.png"
                width="290"
                height="487" />
              <img
                class="gameplay-item-img"
                src="./img/gameplay/gameplay-img1-mob.png"
                alt="Screenshot of the game"
                width="290"
                height="487"
                loading="lazy"
            /></picture>
          </li>
          <li class="swiper-slide gameplay-slide">
            <picture>
              <source
                srcset="./img/gameplay/gameplay-img2-desk.png"
                media="(min-width: 1440px)"
                width="400"
                height="671" />
              <source
                srcset="./img/gameplay/gameplay-img2-mob.png"
                width="290"
                height="487" />
              <img
                class="gameplay-item-img"
                src="./img/gameplay/gameplay-img2-mob.png"
                alt="Screenshot of the game"
                width="290"
                height="487"
                loading="lazy"
            /></picture>
          </li>
          <li class="swiper-slide gameplay-slide">
            <picture>
              <source
                srcset="./img/gameplay/gameplay-img3-desk.png"
                media="(min-width: 1440px)"
                width="400"
                height="671" />
              <source
                srcset="./img/gameplay/gameplay-img3-mob.png"
                width="290"
                height="487" />
              <img
                class="gameplay-item-img"
                src="./img/gameplay/gameplay-img3-mob.png"
                alt="Screenshot of the game"
                width="290"
                height="487"
                loading="lazy"
            /></picture>
          </li>
          <li class="swiper-slide gameplay-slide">
            <picture>
              <source
                srcset="./img/gameplay/gameplay-img4-desk.png"
                media="(min-width: 1440px)"
                width="400"
                height="671" />
              <source
                srcset="./img/gameplay/gameplay-img4-mob.png"
                width="290"
                height="487" />
              <img
                class="gameplay-item-img"
                src="./img/gameplay/gameplay-img4-mob.png"
                alt="Screenshot of the game"
                width="290"
                height="487"
                loading="lazy"
            /></picture>
          </li>
          <li class="swiper-slide gameplay-slide">
            <picture>
              <source
                srcset="./img/gameplay/gameplay-img5-desk.png"
                media="(min-width: 1440px)"
                width="400"
                height="671" />
              <source
                srcset="./img/gameplay/gameplay-img5-mob.png"
                width="290"
                height="487" />
              <img
                class="gameplay-item-img"
                src="./img/gameplay/gameplay-img5-mob.png"
                alt="Screenshot of the game"
                width="290"
                height="487"
                loading="lazy"
            /></picture>
          </li>
        </ul>
        <div class="controls gameplay-controls">
          <button
            class="arrow-btn"
            id="gameplayLeftArrow"
            aria-label="Previous slide"
          >
            <svg class="arrow-icon" width="48" height="48">
              <use href="./img/sprite.svg#icon-arrow-left"></use>
            </svg>
          </button>
          <button
            class="arrow-btn"
            id="gameplayRightArrow"
            aria-label="Next slide"
          >
            <svg class="arrow-icon" width="48" height="48">
              <use href="./img/sprite.svg#icon-arrow-right"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
